# ============================================
# Awards / Honors - 首页 Awards 板块数据源
# ============================================
# 首页只有在下面的列表非空时才会渲染 Awards 卡片。
# 每一项支持的字段：
#   title : 奖项名称，必填
#   year  : 年份，可选，显示在条目右侧
#   link  : 外部链接，可选，填了标题会变成可点击链接
#   desc  : 一句话说明，可选
#
# 取消下面示例的注释即可启用，注意去掉行首的 "# " 之后
# 每行的缩进要对齐，且整个文件只保留一个 YAML 列表。
#
# - title: "国家奖学金"
#   year: 2025
# - title: "山东省优秀毕业生"
#   year: 2026
#   link: "https://example.com"
# - title: "全国大学生数学建模竞赛 二等奖"
#   year: 2021
#   desc: "CUMCM"
